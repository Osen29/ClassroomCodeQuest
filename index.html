<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom Code Quest - Login</title>
    <style>
        body { background: #121214; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: #1a1a1e; padding: 40px; border-radius: 12px; border: 2px solid #29292e; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 400px; width: 100%; }
        h1 { color: #00b4d8; margin-bottom: 10px; font-size: 2rem; }
        p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        button { background: #00b4d8; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        button:hover { background: #0096b4; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Classroom Code Quest</h1>
        <p>Master JavaScript to navigate through your school day adventures!</p>
        
        <!-- Temporary click bypass link until your full Google Cloud API is connected -->
        <button onclick="window.location.href='game.html'">🎒 Sign In with Google</button>
    </div>

</body>
</html>
