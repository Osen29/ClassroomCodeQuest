
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom Code Quest - Play</title>
    <!-- Link your external theme styles sheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Emergency Diagnostic Error Logging Wrapper -->
    <div id="debug-log"></div>

    <!-- Application Top Bar Navigation Controls -->
    <header>
        <div class="logo">Classroom Code Quest 🎒</div>
        <div>
            <label for="level-select">Jump to Level: </label>
            <select id="level-select" onchange="changeLevelViaDropdown(this.value)"></select>
        </div>
        <div id="level-title">Level 1: Loading...</div>
    </header>

    <!-- Main Workspace Split Panels Setup -->
    <div id="layout">
        <!-- Input & Instructions Processing Columns -->
        <div id="left-side" class="panel">
            <div class="objective-card">
                <h3>Current Task</h3>
                <div id="level-desc">Loading instructions from data files...</div>
            </div>
            <textarea id="code-box" spellcheck="false">// Loading game environment data streams...</textarea>
            <button onclick="runStudentCode()">Cast Code Spell</button>
        </div>

        <!-- Dynamic Graphical Visual Output Canvas Window -->
        <div id="right-side" class="panel">
            <canvas id="gameCanvas" width="500" height="200"></canvas>
        </div>
    </div>

    <!-- Hidden system error intercept listener layout safety grid -->
    <script>
        window.onerror = function(message, source, lineno) {
            const box = document.getElementById('debug-log');
            box.style.display = 'block';
            box.innerHTML = '<strong>CRASH DETECTED:</strong> ' + message + ' (Line ' + lineno + ')';
            return false;
        };
    </script>

    <!-- Linked execution script logic pipeline files matrix -->
    <script src="engine.js"></script>
</body>
</html>
